# Pre-scoped contribution gaps, rendered into GitHub issues by
# scripts/seed_issues.py. Nothing here is a verified claim: the agency names are
# starting points for whoever picks the issue up, and part of the task is
# confirming the body still exists under that name and finding its current URL.
#
#   python3 scripts/seed_issues.py            # print what would be created
#   python3 scripts/seed_issues.py --create   # create labels and issues with gh

labels:
  - name: good first issue
    color: "7057ff"
    description: Scoped, self-contained, needs no prior context
  - name: country gap
    color: "0b5fff"
    description: A jurisdiction the list covers thinly or not at all
  - name: coverage gap
    color: "1d76db"
    description: A subcategory that is thinner than the ecosystem it describes
  - name: help wanted
    color: "008672"
    description: Open for anyone to pick up
  - name: resource proposal
    color: "c2e0c6"
    description: Suggestion for a new entry
  - name: correction
    color: "d93f0b"
    description: Something in the list is wrong or has rotted

# Jurisdictions with no national-authority entries at all, or with a single one
# where the agency clearly publishes more. `agency` is a hint, not a fact.
