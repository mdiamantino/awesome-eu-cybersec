name: Link check

on:
  pull_request:
    paths:
      - 'data/resources/**'
  schedule:
    # Weekly, so link rot surfaces as an issue rather than as a reader's dead end.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch every URL
        run: python scripts/check_links.py --concurrency 8 --json ../link-report.json
        working-directory: scripts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.json
