name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate data against schema and scope rules
        run: python scripts/validate.py

      - name: Check generated files are in sync
        run: python scripts/build.py --check --repo "${{ github.repository }}"
